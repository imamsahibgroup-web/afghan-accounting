<!doctype html><html lang='fa' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b63ce'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon-180.png'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='apple-mobile-web-app-title' content='Afghan Accounting'><title>Afghan Accounting | حسابداری افغانی</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;background:#0b63ce;color:#fff;padding:18px 16px 14px}.top h1{font-size:21px;margin:0}.top small{opacity:.9}.nav{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;top:72px;z-index:4;border-bottom:1px solid #eee}.nav button,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.nav button{flex:1;background:#edf3fb;color:#16477c}.nav .active,.primary{background:#0b63ce!important;color:#fff!important}.content{padding:14px}.card{border:1px solid #e5e9f0;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px #00000008}.person{display:flex;justify-content:space-between;align-items:center}.balances{font-size:13px;line-height:1.8;color:#21633c}.row{display:flex;gap:8px}.row>*{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:12px;font-size:16px;background:#fff}label{display:block;font-size:13px;margin:10px 2px 5px;color:#566}.green{background:#16a34a;color:#fff}.red{background:#e53935;color:#fff}.blue{background:#0b63ce;color:#fff}.muted{color:#7b8798;font-size:13px}.tx{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #eee;align-items:center}.pos{color:#16823c;font-weight:700}.neg{color:#d22f2f;font-weight:700}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:left;background:#eee;border:0;border-radius:50%;width:36px;height:36px}.currency-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.balanceBox{padding:12px;border-radius:12px;background:#f1f7ff}.actions{display:flex;gap:8px;margin:10px 0}.actions button{flex:1}.ltr{direction:ltr;text-align:left}.rtl{direction:rtl;text-align:right}@media print{.top,.nav,.noPrint{display:none!important}.app{max-width:none}.card{box-shadow:none;border:0}.content{padding:0}body{background:white}}
</style></head><body><div class='app'><header class='top'><h1>Afghan Accounting</h1><small>حسابداری افغانی</small></header><nav class='nav'><button id='peopleTab' class='active' onclick="showTab('people')">اشخاص</button><button id='reportsTab' onclick="showTab('reports')">گزارش</button><button id='settingsTab' onclick="showTab('settings')">تنظیمات</button></nav><main class='content'>
<section id='people'><div class='row noPrint'><input id='search' placeholder='جستجوی شخص...' oninput='renderPeople()'><button class='btn primary' onclick='openPersonForm()'>+ شخص</button></div><div id='peopleList' style='margin-top:12px'></div></section>
<section id='reports' class='hidden'><div class='card'><h3>ساخت Statement / صورت حساب</h3><label>شخص</label><select id='reportPerson'></select><label>زبان گزارش</label><div class='row'><button class='btn primary' id='faBtn' onclick="setReportLang('fa')">فارسی / دری</button><button class='btn' id='enBtn' onclick="setReportLang('en')">English</button></div><label>ارز</label><select id='reportCurrency'><option value='ALL'>همه ارزها</option><option>AED</option><option>AFN</option><option>USD</option><option>EUR</option></select><div class='actions'><button class='btn primary' onclick='buildReport()'>نمایش گزارش</button><button class='btn green' onclick='printReport()'>PDF / Print</button></div></div><div id='reportView'></div></section>
<section id='settings' class='hidden'><div class='card'><h3>ارزها</h3><p>🇦🇪 AED — درهم امارات</p><p>🇦🇫 AFN — افغانی</p><p>🇺🇸 USD — دلار امریکا</p><p>🇪🇺 EUR — یورو</p></div><div class='card'><h3>پشتیبان‌گیری</h3><p class='muted'>اطلاعات روی همین دستگاه ذخیره می‌شود. برای انتقال به گوشی دیگر، فایل Backup بگیرید.</p><div class='row'><button class='btn primary' onclick='exportBackup()'>Download Backup</button><button class='btn' onclick="document.getElementById('restore').click()">Restore</button></div><input id='restore' class='hidden' type='file' accept='.json' onchange='restoreBackup(this.files[0])'></div></section>
</main></div>
<div id='modal' class='modal hidden' onclick='if(event.target===this)closeModal()'><div class='sheet'><button class='close' onclick='closeModal()'>×</button><div id='modalBody'></div></div></div>
<script>
const CUR={AED:'🇦🇪 AED',AFN:'🇦🇫 AFN',USD:'🇺🇸 USD',EUR:'🇪🇺 EUR'};let data=JSON.parse(localStorage.getItem('afghanAccounting')||'{"people":[]}');let current=null,reportLang='fa';
function save(){localStorage.setItem('afghanAccounting',JSON.stringify(data));renderPeople();fillPeople()}
function showTab(t){['people','reports','settings'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==t);document.getElementById(x+'Tab').classList.toggle('active',x===t)});if(t==='reports')fillPeople()}
function bal(p,c){return p.tx.filter(x=>x.currency===c).reduce((s,x)=>s+(x.type==='given'?x.amount:x.type==='expense'?-x.amount:x.amount),0)}
function renderPeople(){let q=(document.getElementById('search')?.value||'').toLowerCase();let el=document.getElementById('peopleList');el.innerHTML='';data.people.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{let c=p.currency||'AED',b=bal(p,c);el.innerHTML+=`<div class='card person' onclick="openLedger('${p.id}')"><div><b>${esc(p.name)}</b><div class='muted'>${esc(p.phone||'')} · ${CUR[c]}</div></div><div class='balances'><div>${b.toLocaleString()} ${c}</div></div></div>`});if(!data.people.length)el.innerHTML="<div class='card muted'>هنوز شخصی اضافه نشده. روی «+ شخص» بزنید.</div>"}
function openPersonForm(){modal(`<h2>شخص جدید</h2><label>نام / Name</label><input id='pn'><label>شماره تلفن</label><input id='pp'><label>ارز حساب / Account Currency</label><select id='pc'><option value='AED'>🇦🇪 AED — درهم</option><option value='AFN'>🇦🇫 AFN — افغانی</option><option value='USD'>🇺🇸 USD — دلار</option><option value='EUR'>🇪🇺 EUR — یورو</option></select><br><br><button class='btn primary' onclick='addPerson()'>ذخیره</button>`)}
function addPerson(){let n=document.getElementById('pn').value.trim();if(!n)return;data.people.push({id:Date.now().toString(),name:n,phone:document.getElementById('pp').value,currency:document.getElementById('pc').value,tx:[]});save();closeModal()}
function openLedger(id){current=id;let p=data.people.find(x=>x.id===id),c=p.currency||'AED';let box=`<div class='balanceBox'>${CUR[c]}<br><b style='font-size:24px'>${bal(p,c).toLocaleString()} ${c}</b></div>`;let tx=[...p.tx].reverse().map(x=>`<div class='tx'><span class='muted'>${x.date}</span><span>${esc(x.note||labelType(x.type,'fa'))}</span><span class='${x.type==='expense'?'neg':'pos'}'>${x.type==='expense'?'-':'+'}${x.amount.toLocaleString()} ${x.currency}</span></div>`).join('');modal(`<h2>حساب ${esc(p.name)}</h2><div class='muted'>ارز این حساب: ${CUR[c]}</div><br>${box}<div class='actions'><button class='btn green' onclick="txForm('given')">+ پول دادم</button><button class='btn red' onclick="txForm('expense')">مصرف کرد</button><button class='btn blue' onclick="txForm('returned')">برگشت داد</button></div><h3>تراکنش‌ها</h3>${tx||'<p class=muted>تراکنشی نیست.</p>'}<br><button class='btn' onclick="deletePerson('${p.id}')">حذف شخص</button>`)}
function txForm(type){let p=data.people.find(x=>x.id===current),c=p.currency||'AED';modal(`<h2>${labelType(type,'fa')} — ${esc(p.name)}</h2><div class='balanceBox'>ارز حساب: <b>${CUR[c]}</b></div><label>مبلغ (${c})</label><input id='amt' inputmode='decimal' type='number'><input id='cur' type='hidden' value='${c}'><label>تاریخ</label><input id='dt' type='date' value='${new Date().toISOString().slice(0,10)}'><label>توضیحات (فارسی یا English)</label><textarea id='note'></textarea><br><button class='btn primary' onclick="addTx('${type}')">ذخیره</button>`)}
function addTx(type){let a=Number(document.getElementById('amt').value);if(!a)return;let p=data.people.find(x=>x.id===current);p.tx.push({id:Date.now(),type,amount:a,currency:document.getElementById('cur').value,date:document.getElementById('dt').value,note:document.getElementById('note').value});save();openLedger(current)}
function deletePerson(id){if(confirm('حذف شود؟')){data.people=data.people.filter(x=>x.id!==id);save();closeModal()}}
function fillPeople(){let s=document.getElementById('reportPerson');if(!s)return;s.innerHTML=data.people.map(p=>`<option value='${p.id}'>${esc(p.name)}</option>`).join('')}
function setReportLang(l){reportLang=l;document.getElementById('faBtn').classList.toggle('primary',l==='fa');document.getElementById('enBtn').classList.toggle('primary',l==='en')}
function labelType(t,l){let m={fa:{given:'پول داده شد',expense:'مصرف',returned:'برگشت داد'},en:{given:'Money Given',expense:'Expense',returned:'Returned'}};return m[l][t]}
function buildReport(){let id=document.getElementById('reportPerson').value,p=data.people.find(x=>x.id===id);if(!p)return;let c=document.getElementById('reportCurrency').value,tx=p.tx.filter(x=>c==='ALL'||x.currency===c);let rtl=reportLang==='fa';let rows=tx.map(x=>`<tr><td>${x.date}</td><td>${esc(x.note||labelType(x.type,reportLang))}</td><td>${labelType(x.type,reportLang)}</td><td>${x.amount.toLocaleString()}</td><td>${x.currency}</td></tr>`).join('');let balances=Object.keys(CUR).filter(x=>c==='ALL'||x===c).map(x=>`<b>${x}: ${bal(p,x).toLocaleString()}</b>`).join(' &nbsp; ');document.getElementById('reportView').innerHTML=`<div class='card ${rtl?'rtl':'ltr'}'><h2>${rtl?'صورت حساب':'ACCOUNT STATEMENT'}</h2><p>${rtl?'نام شخص':'Name'}: <b>${esc(p.name)}</b></p><p>${rtl?'مانده':'Balance'}: ${balances}</p><table style='width:100%;border-collapse:collapse' border='1' cellpadding='7'><thead><tr><th>${rtl?'تاریخ':'Date'}</th><th>${rtl?'توضیحات':'Description'}</th><th>${rtl?'نوع':'Type'}</th><th>${rtl?'مبلغ':'Amount'}</th><th>${rtl?'ارز':'Currency'}</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function printReport(){buildReport();setTimeout(()=>window.print(),100)}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='afghan-accounting-backup.json';a.click()}
function restoreBackup(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert('Backup restored')}catch(e){alert('Invalid backup')}};r.readAsText(f)}
function modal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderPeople();fillPeople();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
